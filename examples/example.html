<!DOCTYPE html>

  <body>
    <div style="position: fixed; inset: 0;">
      <script src="../dist/yourjs-box.full.js" data-hide-prefix="HIDE" data-divider-orient="vertical">
        // HIDE: \\
        // Definition of the sleep function \\
        async function sleep(msToWait) {
          return new Promise(resolve => setTimeout(resolve, msToWait));
        }

        // Try the different logging functions. \\
        console.log('Paso 1');
        console.warn(1);
        console.error(2);
        console.info(3, new Date(), {people: [{name: 'John Smith'}]});
        console.debug(4);

        // Show some data as a table. \\
        console.table([
          {name: 'John Smith', age: 42},
          {name: 'Jane Doe', email: 'jane@example.com'},
          'just a string',
        ]);

        // HIDE: Sneaky setup \\
        const secret = 'only visible if you expand the hidden block';

        // Call log() once every second for 10 seconds. \\
        (async() => {
          const startTime = Date.now();
          for (let attempt = 0; attempt < 10; attempt++) {
            await sleep(1e3);
            const elapsed = Date.now();
            console.log(`After ${elapsed}ms\u2026`);
          }
        })();
      </script>
    </div>
  </body>
